name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: 新前端（检查 / 测试 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cloud-function:
    name: AI 小助手云函数测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node cloudfunctions/ai-chat/test.js

  legacy:
    name: 旧版语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in app.js assistant.js cloud.js config.js cloudfunctions/ai-chat/index.js; do node --check "$f"; done
